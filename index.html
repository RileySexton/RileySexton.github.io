<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riley Sexton</title>
  <meta name="description" content="Riley Sexton, attorney in Washington, DC.">
  <style>
    :root {
      --paper: #fbfcfb;
      --ink: #1a2420;
      --muted: #5b6862;
      --accent: #2f5d4a;
      --rule: #d6ddd9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #141a17;
        --ink: #e6ebe8;
        --muted: #9aa8a1;
        --accent: #8cc2a8;
        --rule: #2c3631;
      }
    }
    * { box-sizing: border-box; }
    html { font-size: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: 1.125rem;
      line-height: 1.6;
    }
    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 18vh 1.5rem 4rem;
    }
    h1 {
      margin: 0 0 1.25rem;
      font-size: 2.5rem;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.01em;
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      margin-left: -1.1875rem;
    }
    p { margin: 0 0 1rem; }
    .note {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 1rem;
    }
    a { color: var(--accent); text-underline-offset: 0.15em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 40rem) {
      h1 { margin-left: 0; font-size: 2rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Riley Sexton</h1>
    <p>I am an attorney in Washington, DC focused on the renewable energy sector.</p>
    <p class="note">A fuller site, with additional information, is on the way.</p>
    <!-- To add contact information, uncomment the line below and insert your preferred address:
    <p><a href="mailto:you@example.com">you@example.com</a></p>
    -->
  </main>
</body>
</html>
